<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#22C55E",
                        "background-light": "#F9F9F9",
                        "background-dark": "#102216",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "1rem", // Modified to match 16px request
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-[440px] bg-white dark:bg-slate-900 rounded-xl shadow-sm overflow-hidden flex flex-col p-6 sm:p-8">
<!-- Header Section -->
<header class="flex flex-col items-center text-center mb-10">
<div class="flex items-center gap-2 mb-8">
<div class="bg-primary/10 p-2 rounded-lg flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-3xl font-bold">bolt</span>
</div>
<span class="text-2xl font-bold tracking-tight text-slate-900 dark:text-slate-100">FitCenter</span>
</div>
<h1 class="text-3xl font-bold leading-tight text-slate-900 dark:text-slate-100 mb-3 px-2">
                Comienza tu transformación en FitCenter
            </h1>
<p class="text-slate-500 dark:text-slate-400 text-base font-medium">
                Tu centro personal de nutrición y entrenamiento potenciado por tecnología.
            </p>
</header>
<!-- Input Section -->
<div class="space-y-4 mb-6">
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-slate-400 text-xl">mail</span>
</div>
<input class="block w-full pl-12 pr-4 py-4 bg-slate-50 dark:bg-slate-800 border-transparent focus:border-primary focus:ring-0 rounded-xl text-slate-900 dark:text-slate-100 placeholder:text-slate-400 transition-all" placeholder="Tu correo electrónico" type="email"/>
</div>
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/20 transition-all flex items-center justify-center gap-2">
                Continuar con Email
                <span class="material-symbols-outlined text-xl">arrow_forward</span>
</button>
</div>
<!-- Divider -->
<div class="relative flex items-center py-4 mb-6">
<div class="flex-grow border-t border-slate-200 dark:border-slate-700"></div>
<span class="flex-shrink mx-4 text-slate-400 text-sm font-medium">O de forma más rápida</span>
<div class="flex-grow border-t border-slate-200 dark:border-slate-700"></div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-1 gap-3 mb-10">
<button class="flex items-center justify-center gap-3 w-full py-3.5 border border-slate-200 dark:border-slate-700 rounded-xl hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors bg-white dark:bg-slate-900">
<img alt="Google Logo" class="w-4 h-4" data-alt="Logotipo de Google colorido" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDQrChAyyDZfcOOe40DeYdPnT96q4I_qMkIC7mkkdumw4JWFV1DZ8gQ1T1T0jyxY0pj1UpdMrMO4qFq-EWZFlQwmxDuOKrQUfFQu3P-1XCCIa29nBbpf8n7ZhmYXdKRrwbs-NgxUGPiBh5wUQD1rXAToaL7rjgdqR9z32apQZ-R1uXzKoMV69yUdUhT1qw9VSjEVd5xXf0f1GYJKdaTo1kGTCa5yLSbH3xOYv2vzMlWqyeM1LLE_Kj6cZAI5-ENC83jpA4XQd7zUQ"/>
<span class="text-slate-700 dark:text-slate-200 font-semibold">Continuar con Google</span>
</button>
<button class="flex items-center justify-center gap-3 w-full py-3.5 bg-black hover:bg-black/90 text-white rounded-xl transition-colors">
<span class="material-symbols-outlined text-lg">ios</span>
<span class="font-semibold">Continuar con Apple</span>
</button>
</div>
<!-- Footer Section -->
<footer class="mt-auto text-center px-4">
<p class="text-xs text-slate-400 leading-relaxed">
                Al continuar, aceptas nuestros 
                <a class="text-slate-600 dark:text-slate-300 font-medium hover:underline" href="#">Términos</a> 
                y 
                <a class="text-slate-600 dark:text-slate-300 font-medium hover:underline" href="#">Política de Privacidad</a>.
            </p>
</footer>
</div>
</body></html>
