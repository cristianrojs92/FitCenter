<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Nutritional App Onboarding</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec5b",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102216",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen">
<div class="max-w-md mx-auto min-h-screen flex flex-col">
<!-- Header & Progress Section -->
<header class="p-4 bg-background-light dark:bg-background-dark sticky top-0 z-10">
<div class="flex items-center justify-between mb-4">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors" style="">
<span class="material-symbols-outlined" style="">arrow_back</span>
</button>
<div class="w-10"></div>
</div>
</header>
<main class="flex-1 px-4 py-6">
<!-- Step 1 Title -->
<div class="text-center mb-8">
<h1 class="text-3xl font-bold mb-2" style="">Información Básica</h1>
<p class="text-slate-600 dark:text-slate-400" style="">Empecemos con lo básico para personalizar tu plan de nutrición.</p>
</div>
<form class="space-y-6">
<!-- Gender Toggle -->
<div class="space-y-3">
<label class="block text-sm font-semibold text-slate-700 dark:text-slate-300" style="">Género Biológico</label>
<div class="flex p-1 bg-slate-200 dark:bg-slate-800 rounded-xl">
<label class="flex-1 cursor-pointer" style="">
<input checked="" class="hidden peer" name="gender" type="radio" value="male"/>
<div class="flex items-center justify-center py-3 rounded-lg peer-checked:bg-white dark:peer-checked:bg-slate-700 peer-checked:shadow-sm transition-all text-slate-600 dark:text-slate-400 peer-checked:text-slate-900 dark:peer-checked:text-white font-medium" style="">Hombre</div>
</label>
<label class="flex-1 cursor-pointer" style="">
<input class="hidden peer" name="gender" type="radio" value="female"/>
<div class="flex items-center justify-center py-3 rounded-lg peer-checked:bg-white dark:peer-checked:bg-slate-700 peer-checked:shadow-sm transition-all text-slate-600 dark:text-slate-400 peer-checked:text-slate-900 dark:peer-checked:text-white font-medium" style="">Mujer</div>
</label>
</div>
</div>
<!-- Input Grid -->
<div class="grid grid-cols-2 gap-4">
<div class="space-y-2">
<label class="block text-sm font-semibold text-slate-700 dark:text-slate-300" style="">Edad</label>
<div class="relative">
<input class="w-full h-14 bg-white dark:bg-slate-900 border-2 border-slate-200 dark:border-slate-800 rounded-xl px-4 focus:border-primary focus:ring-0 text-lg font-bold" placeholder="25" type="number"/>
<span class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm" style="">años</span>
</div>
</div>
<div class="space-y-2">
<label class="block text-sm font-semibold text-slate-700 dark:text-slate-300" style="">Peso</label>
<div class="relative">
<input class="w-full h-14 bg-white dark:bg-slate-900 border-2 border-slate-200 dark:border-slate-800 rounded-xl px-4 focus:border-primary focus:ring-0 text-lg font-bold" placeholder="70" type="number"/>
<span class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm" style="">kg</span>
</div>
</div>
</div>
<div class="space-y-2">
<label class="block text-sm font-semibold text-slate-700 dark:text-slate-300" style="">Altura</label>
<div class="relative">
<input class="w-full h-14 bg-white dark:bg-slate-900 border-2 border-slate-200 dark:border-slate-800 rounded-xl px-4 focus:border-primary focus:ring-0 text-lg font-bold" placeholder="175" type="number"/>
<span class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm" style="">cm</span>
</div>
</div>
<!-- Activity Level (Preview/Drafting next step visual) -->
<div class="pt-4">
<label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-4" style="">Nivel de Actividad</label>
<div class="space-y-3">
<button class="w-full flex items-center p-4 bg-white dark:bg-slate-900 border-2 border-slate-200 dark:border-slate-800 rounded-xl hover:border-primary transition-all group" style="" type="button">
<div class="w-12 h-12 rounded-lg bg-primary/10 flex items-center justify-center text-primary group-hover:bg-primary group-hover:text-slate-900">
<span class="material-symbols-outlined" style="">chair</span>
</div>
<div class="ml-4 text-left">
<p class="font-bold" style="">Sedentario</p>
<p class="text-xs text-slate-500 dark:text-slate-400" style="">Poco o nada de ejercicio, trabajo de escritorio</p>
</div>
</button>
<button class="w-full flex items-center p-4 bg-white dark:bg-slate-900 border-2 border-primary rounded-xl ring-2 ring-primary/20 group" style="" type="button">
<div class="w-12 h-12 rounded-lg bg-primary flex items-center justify-center text-slate-900">
<span class="material-symbols-outlined" style="">directions_walk</span>
</div>
<div class="ml-4 text-left">
<p class="font-bold" style="">Moderado</p>
<p class="text-xs text-slate-500 dark:text-slate-400" style="">Ejercicio 3-5 veces por semana</p>
</div>
<div class="ml-auto text-primary">
<span class="material-symbols-outlined" style="">check_circle</span>
</div>
</button>
</div>
</div>
<!-- Goal Selection (Step 3 Concept) -->
<div class="pt-4 pb-8">
<label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-4" style="">¿Cuál es tu objetivo principal?</label>
<div class="grid grid-cols-2 gap-4">
<button class="aspect-square flex flex-col items-center justify-center p-4 bg-white dark:bg-slate-900 border-2 border-slate-200 dark:border-slate-800 rounded-2xl hover:border-primary transition-all" style="" type="button">
<span class="material-symbols-outlined text-4xl mb-2 text-primary" style="">fitness_center</span>
<span class="font-bold" style="">Ganar Músculo</span>
</button>
<button class="aspect-square flex flex-col items-center justify-center p-4 bg-white dark:bg-slate-900 border-2 border-slate-200 dark:border-slate-800 rounded-2xl hover:border-primary transition-all" style="" type="button">
<span class="material-symbols-outlined text-4xl mb-2 text-primary" style="">monitor_weight</span>
<span class="font-bold" style="">Perder Grasa</span>
</button>
</div>
</div>
</form>
</main>
<!-- Footer Action -->
<footer class="p-4 bg-background-light dark:bg-background-dark border-t border-slate-200 dark:border-slate-800 sticky bottom-0">
<button class="w-full bg-primary text-slate-900 font-bold py-4 rounded-xl shadow-lg shadow-primary/20 hover:scale-[1.02] active:scale-[0.98] transition-all flex items-center justify-center gap-2" style="">Continuar <span class="material-symbols-outlined" style="">arrow_forward</span></button>
</footer>
</div>
</body></html>
